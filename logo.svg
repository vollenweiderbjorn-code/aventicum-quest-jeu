<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital@1&amp;display=swap');
      .badge-bg { fill: #0c0f16; }
      .ring-outer { fill: none; stroke: #c9a24b; stroke-width: 2; }
      .ring-inner { fill: none; stroke: #c9a24b; stroke-width: 1; opacity: 0.6; }
      .gold { fill: #c9a24b; }
      .gold-line { fill: none; stroke: #c9a24b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .gold-line-thin { fill: none; stroke: #c9a24b; stroke-width: 1.4; }
      .title { font-family: 'Cinzel', serif; font-weight: 700; fill: #c9a24b; letter-spacing: 6px; }
      .subtitle { font-family: 'Cinzel', serif; font-weight: 500; fill: #c9a24b; letter-spacing: 5px; }
      .tagline { font-family: 'Cormorant Garamond', serif; font-style: italic; fill: #ede3c8; }
    </style>
    <path id="arcTop" d="M 126.79,200 A 200,200 0 0,1 473.21,200" fill="none"/>
    <path id="arcBottom" d="M 131.13,397.5 A 195,195 0 0,0 468.87,397.5" fill="none"/>
  </defs>

  <!-- BADGE -->
  <circle cx="300" cy="300" r="270" class="badge-bg"/>
  <circle cx="300" cy="300" r="262" class="ring-outer"/>
  <circle cx="300" cy="300" r="232" class="ring-inner"/>

  <text class="title" font-size="26">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">AVENTICUM QUEST</textPath>
  </text>
  <text class="subtitle" font-size="16">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">AVENCHES · SUISSE</textPath>
  </text>

  <!-- small diamond dividers at ring -->
  <rect x="296" y="160" width="8" height="8" class="gold" transform="rotate(45 300 164)"/>
  <rect x="296" y="432" width="8" height="8" class="gold" transform="rotate(45 300 436)"/>

  <!-- COLUMN ICON (broken Roman column, referencing the Cigognier sanctuary column) -->
  <g transform="translate(300,302)">
    <!-- plinth -->
    <rect x="-42" y="78" width="84" height="12" class="gold"/>
    <rect x="-34" y="68" width="68" height="10" class="gold-line-thin" fill="#0c0f16"/>
    <!-- shaft -->
    <path d="M -26,68 L -22,-58 L 22,-58 L 26,68 Z" fill="#0c0f16" class="gold-line"/>
    <!-- fluting -->
    <line x1="-13" y1="-50" x2="-15" y2="60" class="gold-line-thin"/>
    <line x1="0" y1="-50" x2="0" y2="62" class="gold-line-thin"/>
    <line x1="13" y1="-50" x2="15" y2="60" class="gold-line-thin"/>
    <!-- broken capital, jagged top -->
    <path d="M -22,-58 L -30,-70 L -16,-66 L -6,-78 L 6,-64 L 18,-76 L 30,-62 L 22,-58 Z" class="gold" fill="#c9a24b"/>
    <!-- 8 tally marks beneath plinth: the 8 enigmas -->
    <g class="gold-line-thin" stroke-width="2">
      <line x1="-35" y1="100" x2="-35" y2="112"/>
      <line x1="-25" y1="100" x2="-25" y2="112"/>
      <line x1="-15" y1="100" x2="-15" y2="112"/>
      <line x1="-5" y1="100" x2="-5" y2="112"/>
      <line x1="5" y1="100" x2="5" y2="112"/>
      <line x1="15" y1="100" x2="15" y2="112"/>
      <line x1="25" y1="100" x2="25" y2="112"/>
      <line x1="35" y1="100" x2="35" y2="112"/>
    </g>
  </g>
</svg>
