<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aventicum Quest">
  <style>
    .bg   { fill: #0c0f16; }
    .gold { fill: #c9a24b; }
    .ring1{ fill: none; stroke: #c9a24b; stroke-width: 4; }
    .ring2{ fill: none; stroke: #c9a24b; stroke-width: 2; opacity: .6; }
    .line { fill: none; stroke: #c9a24b; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke: #c9a24b; stroke-width: 2.4; opacity: .85; }
  </style>

  <circle cx="300" cy="300" r="288" class="bg"/>
  <circle cx="300" cy="300" r="264" class="ring1"/>
  <circle cx="300" cy="300" r="232" class="ring2"/>

  <rect x="291" y="141" width="18" height="18" class="gold" transform="rotate(45 300 150)"/>
  <rect x="291" y="441" width="18" height="18" class="gold" transform="rotate(45 300 450)"/>

  <!-- Colonne romaine brisée (agrandie pour la lisibilité en petit) -->
  <g transform="translate(300,302) scale(1.42)">
    <path d="M -26,68 L -22,-58 L 22,-58 L 26,68 Z" class="bg"/>
    <path d="M -26,68 L -22,-58 L 22,-58 L 26,68 Z" class="line"/>
    <line x1="-13" y1="-50" x2="-15" y2="60" class="thin"/>
    <line x1="0"   y1="-50" x2="0"   y2="62" class="thin"/>
    <line x1="13"  y1="-50" x2="15"  y2="60" class="thin"/>
    <path d="M -22,-58 L -30,-70 L -16,-66 L -6,-78 L 6,-64 L 18,-76 L 30,-62 L 22,-58 Z" class="gold"/>
    <rect x="-42" y="78" width="84" height="12" class="gold"/>
    <rect x="-34" y="68" width="68" height="10" class="bg"/>
    <rect x="-34" y="68" width="68" height="10" fill="none" stroke="#c9a24b" stroke-width="2"/>
    <g stroke="#c9a24b" stroke-width="3">
      <line x1="-35" y1="100" x2="-35" y2="112"/>
      <line x1="-25" y1="100" x2="-25" y2="112"/>
      <line x1="-15" y1="100" x2="-15" y2="112"/>
      <line x1="-5"  y1="100" x2="-5"  y2="112"/>
      <line x1="5"   y1="100" x2="5"   y2="112"/>
      <line x1="15"  y1="100" x2="15"  y2="112"/>
      <line x1="25"  y1="100" x2="25"  y2="112"/>
      <line x1="35"  y1="100" x2="35"  y2="112"/>
    </g>
  </g>
</svg>
